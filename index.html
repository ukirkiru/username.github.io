<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KakaoTalk Simulator</title>
    <style>
        :root {
            --iphone-w: 375px;
            --iphone-h: 812px;
            --ios-font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        }

        body {
            background-color: #0e0e10;
            color: #fff;
            font-family: var(--ios-font);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* 📱 캡처 화면 비율의 정밀 아이폰 스크린 캔버스 */
        .iphone-canvas {
            width: var(--iphone-w);
            height: var(--iphone-h);
            background-color: #abc1d1; /* 카카오톡 순정 블루 배경색 */
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
        }

        /* 📊 iOS 순정 상단바 기믹 */
        .ios-header {
            height: 44px;
            padding: 0 32px 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            font-weight: 600;
            color: #000; /* 이미지처럼 상단 바는 검은색 글씨 */
            position: absolute;
            width: calc(100% - 64px);
            z-index: 100;
            box-sizing: border-box;
        }

        /* 🔔 [핵심] 상단 카카오톡 푸시 알림 배너 (애플 순정 팝업 스타일) */
        .ios-banner {
            position: absolute;
            top: 50px;
            left: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 22px;
            padding: 14px 16px;
            color: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            z-index: 200;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 0.85rem;
        }
        .banner-icon {
            width: 38px;
            height: 38px;
            background-color: #fee500;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.75rem;
        }
        .banner-info { flex: 1; }
        .banner-title { font-weight: bold; font-size: 0.88rem; margin-bottom: 2px; display: flex; justify-content: space-between; }
        .banner-title .time { font-weight: normal; color: #666; font-size: 0.75rem; }
        .banner-body { color: #333; line-height: 1.3; font-size: 0.85rem; }

        /* 📊 세계관 전용 게이지 바 ([의심도 +8]) */
        .stat-gauge-area {
            position: absolute;
            top: 155px;
            left: 20px;
            right: 20px;
            z-index: 90;
        }
        .stat-label {
            color: #d9383a; /* 이미지 속 특유의 진한 빨간색 글씨 */
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 4px;
            text-shadow: 0.5px 0.5px 1px rgba(255,255,255,0.8);
        }
        .gauge-track {
            height: 6px;
            background-color: rgba(0,0,0,0.15);
            border-radius: 3px;
            overflow: hidden;
            width: 140px;
        }
        .gauge-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff9500, #ff3b30);
            width: 65%; /* 수치 조절용 */
        }

        /* 💬 카카오톡 채팅방 메인 스크롤 구역 */
        .chat-scroll-view {
            height: 100%;
            box-sizing: border-box;
            padding: 190px 16px 80px 16px; /* 위젯과 상단바 공간 확보 */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* 👤 상대방 말풍선 한 세트 (프로필 이미지 + 이름 + 말풍선들) */
        .chat-group {
            display: flex;
            flex-direction: column;
            position: relative;
            padding-left: 52px; /* 프로필 공간 */
            margin-bottom: 8px;
        }
        .sender-avatar {
            position: absolute;
            left: 0;
            top: 2px;
            width: 40px;
            height: 40px;
            border-radius: 15px;
            background-color: #ddd;
            overflow: hidden;
        }
        .sender-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .sender-name {
            font-size: 0.78rem;
            color: #4f5860;
            margin-bottom: 5px;
            font-weight: 500;
        }

        /* 💬 카카오톡 오리지널 화이트 말풍선 스타일 정밀 이식 */
        .bubble {
            background-color: #ffffff;
            color: #000;
            font-size: 0.92rem;
            padding: 8px 12px;
            border-radius: 14px;
            max-width: 230px;
            width: fit-content;
            line-height: 1.4;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
            box-shadow: 0 1px 1px rgba(0,0,0,0.05);
            font-weight: 400;
        }
        /* 첫 번째 말풍선에만 들어가는 카카오톡 특유의 왼쪽 뾰족한 대화 촉 효과 */
        .chat-group .bubble:first-of-type {
            border-top-left-radius: 3px;
        }

        /* 🔴 하단 새 메시지 도착 팝업 단추 */
        .new-msg-toast {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ff4b42; /* 이미지와 매칭되는 다홍빛 레드 */
            color: #fff;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            cursor: pointer;
            z-index: 150;
        }
        .new-msg-toast::before {
            content: "●";
            color: #fff;
            font-size: 0.6rem;
        }

        /* 🟡 우측 상단 가상 노란 뱃지 기믹 */
        .yellow-badge {
            position: absolute;
            top: 190px;
            right: 16px;
            width: 22px;
            height: 22px;
            background-color: #fee500;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-size: 0.75rem;
            font-weight: bold;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="iphone-canvas">
        <!-- iOS 순정 상단 정보 레이어 -->
        <div class="ios-header">
            <span>7:59</span>
            <span>📶 🛜 82</span>
        </div>

        <!-- 🔔 진짜 아이폰 상단 푸시 알림 배너 스크립트 -->
        <div class="ios-banner">
            <div class="banner-icon">TALK</div>
            <div class="banner-info">
                <div class="banner-title">KakaoTalk <span class="time">지금</span></div>
                <div class="banner-body"><strong>리쿠:</strong> 왜 대답을 안 해 ㅠㅠ 제발 말 좀 해</div>
            </div>
        </div>

        <!-- 📊 포스타입 전용 상태 수치 바 디자인 -->
        <div class="stat-gauge-area">
            <div class="stat-label">[의심도 +8]</div>
            <div class="gauge-track">
                <div class="gauge-bar"></div>
            </div>
        </div>

        <!-- 🟡 우측 가상 버튼 레이어 -->
        <div class="yellow-badge">ㅇ</div>

        <!-- 💬 카카오톡 타임라인 연출 무대 -->
        <div class="chat-scroll-view">
            
            <!-- 시온 오빠 대화 묶음 1 -->
            <div class="chat-group">
                <div class="sender-avatar">
                    <img src="https://unsplash.com" alt="avatar">
                </div>
                <div class="sender-name">시온 오빠</div>
                <div class="bubble">응이 뭐야 ㅋㅋㅋ</div>
                <div class="bubble">갑자기 졸려?</div>
                <div class="bubble">내일 점심은 푹 자고 나와</div>
            </div>

            <!-- 시온 오빠 대화 묶음 2 -->
            <div class="chat-group">
                <div class="sender-avatar">
                    <img src="https://unsplash.com" alt="avatar">
                </div>
                <div class="sender-name">시온 오빠</div>
                <div class="bubble">진짜 잠든 거 아니지?</div>
                <div class="bubble">지금쯤이면 꿈나라 가있을 듯</div>
                <div class="bubble">얼른 충전해야지 내일 만나서 놀지</div>
            </div>

            <!-- 시온 오빠 대화 묶음 3 (이미지 하단부 소름 돋는 연출 매칭) -->
            <div class="chat-group">
                <div class="sender-avatar">
                    <img src="https://unsplash.com" alt="avatar">
                </div>
                <div class="sender-name">시온 오빠</div>
                <div class="bubble">여주야</div>
                <div class="bubble">기대하게 만들고 이게 뭐하는 거냐</div>
                <div class="bubble">다른 사람이랑 그렇게 웃고 있었구나</div>
                <div class="bubble">지금 당장 전화해</div>
            </div>

        </div>

        <!-- 🔴 최하단 새 메시지 토스트 알림 단추 -->
        <div class="new-msg-toast">새 메시지 도착</div>
    </div>

</body>
</html>
