<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone 15 시뮬레이터</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh; min-height: 100dvh; display: flex; align-items: flex-start; justify-content: center; padding: 4px 0;
    background: radial-gradient(circle at top, #2b2d42, #0d0e16 70%);
    font-family: -apple-system, BlinkMacSystemFont,
    "Helvetica Neue", Arial, sans-serif;
    color: #111; user-select: none;
  }
  .phone {
  position: relative;
  width: 393px;
  height: 780px;
  border-radius: 40px;
  background: #111;
  padding: 10px;
  box-shadow: 0 0 0 3px #3a3a3c, 0 15px 40px rgba(0,0,0,.6);
  flex-shrink: 0;
}
  .screen-wrap {
    position: relative; width: 100%; height: 100%; border-radius: 45px; overflow: hidden; background: #000;
  }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 124px; height: 36px; background: #000; border-radius: 20px; z-index: 100;
  }
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 90;
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 34px 0 42px; font-weight: 600; font-size: 16px; color: #fff; pointer-events: none;
    transition: color .3s;
  }
  .statusbar.dark { color: #000; }
  .statusbar .icons {
  font-size: 13px;
  letter-spacing: 0;
  white-space: nowrap;
}
  .screen {
    position: absolute; inset: 0; background: #f2f2f7; display: none; flex-direction: column;
    padding-top: 54px; animation: fadeIn .25s ease;
  }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }
  .home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px; background: #fff; z-index: 100; cursor: pointer;
  }
  .home-indicator.dark { background: #000; }
  /* HOME */
  #home {
    background: url("wallpaper.jpg") center / cover no-repeat;
  }
  .clock-widget { color: #fff; text-align: center; margin-bottom: 26px; }
  .clock-widget .time { font-size: 72px; font-weight: 300; line-height: 1; }
  .clock-widget .date { font-size: 15px; opacity: .85; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 22px; justify-items: center; }
  .app-icon { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; width: 74px; }
  .app-icon .ic {
    width: 62px; height: 62px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    font-size: 30px; box-shadow: 0 2px 6px rgba(0,0,0,.25); transition: transform .15s;
  }
  .app-icon:active .ic { transform: scale(.9); }
  .app-icon span { color: #fff; font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,.4); white-space: nowrap; }
  .dock {
    position: absolute; bottom: 26px; left: 14px; right: 14px; height: 96px; border-radius: 30px;
    background: rgba(255,255,255,.25); backdrop-filter: blur(12px); display: flex; justify-content: space-around; align-items: center;
  }
  .dock .app-icon span { display: none; }
  /* COMMON HEADER */
  .header {
    display: flex; align-items: center; justify-content: space-between; padding: 8px 14px;
    background: rgba(249,249,249,.94); border-bottom: 1px solid #d1d1d6; min-height: 52px; flex-shrink: 0;
  }
  .header .title { font-weight: 700; font-size: 17px; }
  .header .back { color: #007aff; font-size: 17px; cursor: pointer; min-width: 60px; }
  .header .right { min-width: 60px; text-align: right; color: #007aff; font-size: 20px; cursor: pointer; }
  .content { flex: 1; overflow-y: auto; padding-bottom: 40px; }
  .content::-webkit-scrollbar { display: none; }
  .list-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #fff; cursor: pointer; border-bottom: 1px solid #ececf0;
  }
  .list-item:active { background: #e5e5ea; }
  .avatar {
    width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 18px; flex-shrink: 0;
  }
  .list-item .meta { flex: 1; min-width: 0; }
  .list-item .name { font-weight: 600; font-size: 16px; }
  .list-item .preview { color: #8e8e93; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .list-item .time-s { color: #8e8e93; font-size: 12px; align-self: flex-start; margin-top: 2px; }
  /* CHAT */
  .chat-body { flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 6px; }
  .chat-body::-webkit-scrollbar { display: none; }
  .bubble {
    max-width: 72%; padding: 9px 13px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-break: keep-all; animation: pop .2s ease;
  }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
  .bubble.me { align-self: flex-end; color: #fff; border-bottom-right-radius: 4px; }
  .bubble.them { align-self: flex-start; background: #e9e9eb; color: #000; border-bottom-left-radius: 4px; }
  .sys { align-self: center; color: #8e8e93; font-size: 12px; margin: 6px 0; }
  .typing { align-self: flex-start; background: #e9e9eb; padding: 12px 14px; border-radius: 18px; display: flex; gap: 4px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #8e8e93; animation: blink 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  .input-bar {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px 26px; background: #f9f9f9; border-top: 1px solid #d1d1d6;
  }
  .input-bar input {
    flex: 1; height: 36px; border-radius: 18px; border: 1px solid #d1d1d6; padding: 0 14px; font-size: 15px; outline: none; background: #fff;
  }
  .input-bar button {
    height: 36px; padding: 0 14px; border: none; border-radius: 18px; color: #fff; font-weight: 600; cursor: pointer;
  }
  /* PHONE */
  .keypad { padding: 10px 30px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .display { font-size: 36px; height: 48px; font-weight: 300; color: #000; letter-spacing: 2px; margin-top: 10px; }
 .dial-display-row {
  position: relative;
  width: 100%;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 10px;
}

.dial-display-row .display {
  margin-top: 0;
  max-width: 100%;
  overflow: hidden;
  white-space: nowrap;
  font-size: 30px;
}

.delete-btn {
  position: absolute;
  right: 0;
  border: none;
  background: transparent;
  color: #8e8e93;
  font-size: 25px;
  cursor: pointer;
  padding: 5px;
}
  .keys { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px; }
  .key {
    width: 76px; height: 76px; border-radius: 50%; background: #e5e5ea; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 30px; cursor: pointer; font-weight: 400;
  }
  .key small { font-size: 9px; letter-spacing: 2px; color: #3c3c43; margin-top: -4px; }
  .key:active { background: #c7c7cc; }
  .call-btn {
    width: 76px; height: 76px; border-radius: 50%; background: #34c759; color: #fff; font-size: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-top: 6px;
  }
  .call-screen {
    position: absolute; inset: 0; background: linear-gradient(180deg, #3a3f55, #111); color: #fff; z-index: 80;
    display: none; flex-direction: column; align-items: center; padding: 120px 20px 60px; text-align: center;
  }
  .call-screen.show { display: flex; }
  .call-screen .big-av { width: 120px; height: 120px; border-radius: 50%; font-size: 48px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
  .call-screen .cname { font-size: 30px; font-weight: 500; }
  .call-screen .cstat { font-size: 16px; opacity: .75; margin-top: 8px; }
  .end-btn { margin-top: auto; width: 76px; height: 76px; border-radius: 50%; background: #ff3b30; color: #fff; font-size: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; transform: rotate(135deg); }
  .seg { display: flex; background: #e5e5ea; border-radius: 9px; padding: 2px; margin: 10px 16px; }
  .seg div { flex: 1; text-align: center; padding: 6px; border-radius: 7px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .seg div.on { background: #fff; }
  .missed { color: #ff3b30 !important; }
  /* INSTAGRAM */
  .ig-top { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; background: #fff; border-bottom: 1px solid #dbdbdb; }
  .ig-logo { font-family: "Brush Script MT", cursive; font-size: 30px; font-weight: 700; }
  .stories { display: flex; gap: 12px; padding: 10px 12px; overflow-x: auto; background: #fff; border-bottom: 1px solid #dbdbdb; }
  .stories::-webkit-scrollbar { display: none; }
  .story { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; min-width: 66px; cursor: pointer; }
  .story .ring { width: 62px; height: 62px; border-radius: 50%; padding: 2px; background: linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7); }
  .story .ring div { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; font-weight: 700; }
  .post { background: #fff; margin-bottom: 10px; border-bottom: 1px solid #dbdbdb; }
  .post-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-size: 14px; font-weight: 600; }
  .post-head .avatar { width: 34px; height: 34px; font-size: 14px; }
  .post-img { height: 340px; display: flex; align-items: center; justify-content: center; font-size: 90px; cursor: pointer; }
  .post-actions { display: flex; gap: 16px; padding: 10px 12px 4px; font-size: 24px; }
  .post-actions span { cursor: pointer; }
  .post-actions .count { font-size: 14px; align-self: center; font-weight: 600; }
  .post-cap { padding: 4px 12px 14px; font-size: 14px; line-height: 1.4; }
  .ig-tabbar { display: flex; justify-content: space-around; padding: 10px 0 26px; background: #fff; border-top: 1px solid #dbdbdb; font-size: 22px; }
  /* FACEBOOK */
  .fb-top { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; background: #fff; }
  .fb-logo { color: #1877f2; font-weight: 800; font-size: 28px; }
  .fb-round { width: 36px; height: 36px; border-radius: 50%; background: #e4e6eb; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .fb-composer { background: #fff; padding: 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; }
  .fb-composer .box { flex: 1; background: #f0f2f5; border-radius: 20px; padding: 9px 14px; color: #65676b; font-size: 14px; cursor: pointer; }
  .fb-post { background: #fff; margin-bottom: 8px; padding-bottom: 6px; }
  .fb-post .ph { padding: 12px; display: flex; gap: 10px; align-items: center; }
  .fb-post .ph .avatar { width: 40px; height: 40px; font-size: 16px; }
  .fb-post .ph .n { font-weight: 600; font-size: 15px; }
  .fb-post .ph .t { font-size: 12px; color: #65676b; }
  .fb-post .txt { padding: 0 12px 10px; font-size: 15px; line-height: 1.45; }
  .fb-media { height: 240px; display: flex; align-items: center; justify-content: center; font-size: 80px; }
  .fb-stats { display: flex; justify-content: space-between; padding: 8px 12px; color: #65676b; font-size: 13px; border-bottom: 1px solid #e4e6eb; margin: 0 12px; padding-left: 0; padding-right: 0; }
  .fb-btns { display: flex; justify-content: space-around; padding: 4px 6px; }
  .fb-btns div { flex: 1; text-align: center; padding: 8px; color: #65676b; font-weight: 600; font-size: 14px; border-radius: 6px; cursor: pointer; }
  .fb-btns div:active { background: #f0f2f5; }
  .fb-btns div.liked { color: #1877f2; }
  .fb-tabbar { display: flex; justify-content: space-around; padding: 8px 0 26px; background: #fff; border-top: 1px solid #d1d1d6; font-size: 22px; }
  /* SETTINGS / SIMPLE */
  .simple { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #8e8e93; gap: 10px; font-size: 15px; }
  .simple .big { font-size: 60px; }
  .toast {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(40,40,40,.92); color: #fff; padding: 10px 16px; border-radius: 14px; font-size: 14px; z-index: 200; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  .hint {
    position: absolute; left: 50%; transform: translateX(-50%); top: -48px; color: #aaa; font-size: 13px; white-space: nowrap;
  }
/* LOCK SCREEN */
.lock-screen {
  position: absolute;
  inset: 0;
  z-index: 150;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  color: white;
  background: url("wallpaper.jpg") center / cover no-repeat;
  padding: 22px 24px 35px;
}

.lock-screen.hidden {
  display: none;
}

.lock-top {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  font-weight: 600;
  padding: 5px 10px;
}

.lock-info {
  position: absolute;
  top: 22%;
  left: 0;
  width: 100%;
  text-align: center;
}

.lock-date {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 8px;
  text-shadow: 0 2px 8px #3335;
}

.lock-time {
  font-size: 82px;
  font-weight: 500;
  letter-spacing: -3px;
  line-height: 1.1;
  text-shadow: 0 2px 10px #3333;
}
 
.lock-bottom {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
}

.lock-shortcuts {
  width: 100%;
  display: flex;
  justify-content: space-between;
  padding: 0 8px;
}

.lock-circle {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: rgba(0,0,0,.28);
  border: 1px solid rgba(255,255,255,.25);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  cursor: pointer;
}

.unlock-btn {
  border: none;
  background: transparent;
  color: white;
  font-size: 25px;
  text-align: center;
  cursor: pointer;
  text-shadow: 0 1px 5px #3335;
}

.unlock-btn span {
  font-size: 13px;
  letter-spacing: .5px;
}
</style>
</head>

  if (s.length <= 3) return s;
  if (s.length <= 7) return s.slice(0,3) + '-' + s.slice(3);

function dialCall() {
  const digits = dial.replace(/\D/g, '');
  if (!digits) { renderRecents(); phoneTab('recent'); return; }
  const c = CONTACTS.find(x => x.num.replace(/\D/g,'') === digits);
  if (c) startCall(c);
  else startCall({ name: formatNum(digits), num: formatNum(digits), color: '#8e8e93', avatar: '?', answer: '여보세요?' });
}
function startCall(c) {
  $('callAv').style.background = c.color;

    let sec = 0;

    window._timer = setInterval(() => {
      sec++;
      $('callStat').textContent = String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
    }, 1000);
    window._answerTimer = setTimeout(() => {
      toast(`${c.name}: ${c.answer}`);
    }, 800);
  }, 1500);
  window._cur = c;
}
function endCall() {
  clearInterval(window._timer);

  $('phoneContactsView').innerHTML = CONTACTS.map(c => `
    <div class="list-item" onclick='startCall(${JSON.stringify(c).replace(/'/g,"&#39;")})'>
      <div class="avatar" style="background:${c.color}">${c.avatar}</div>
      <div class="meta"><div class="name">${c.name}</div><div class="preview">${c.num}</div></div>
      <span style="color:#34c759;font-size:22px;"><svg width="34" height="34" viewBox="0 0 24 24"
     fill="none" stroke="#fff" stroke-width="2.5"
     stroke-linecap="round" stroke-linejoin="round">
  <path d="M22 16.92v3a2 2 0 0 1-2.18 2
  19.79 19.79 0 0 1-8.63-3.07
  19.5 19.5 0 0 1-6-6
  19.79 19.79 0 0 1-3.07-8.67
  A2 2 0 0 1 4.11 2h3
  a2 2 0 0 1 2 1.72
  12.84 12.84 0 0 0 .7 2.81
  2 2 0 0 1-.45 2.11L8.09 9.91
  a16 16 0 0 0 6 6l1.27-1.27
  a2 2 0 0 1 2.11-.45
  12.84 12.84 0 0 0 2.81.7
  A2 2 0 0 1 22 16.92z"/>
</svg></span></div>`).join('');
}
/* ---------- 인스타그램 ---------- */
let igRendered = false;
function renderInsta() {
  if (igRendered) return;
  igRendered = true;
  $('igStories').innerHTML = STORIES.map((s, i) => `
    <div class="story" onclick="toast('${s} 스토리')"><div class="ring"><div style="background:${['#ff9f0a','#30d158','#5e5ce6','#0a84ff','#ff375f'][i]}">${s[0].toUpperCase()}</div></div><span>${s}</span></div>`).join('');
  $('igFeed').innerHTML = FEEDS_IG.map((p, i) => `
    <div class="post">
      <div class="post-head"><div class="avatar" style="background:${p.color}">${p.av}</div>${p.user}<span style="margin-left:auto;">•••</span></div>
      <div class="post-img" style="background:${p.bg}" ondblclick="likeIG(${i})">${p.emoji}</div>
      <div class="post-actions">
        <span id="igHeart${i}" onclick="likeIG(${i})">♡</span><span onclick="toast('댓글 기능은 체험용으로 준비 중입니다')">💬</span><span onclick="toast('공유 완료!')">✈︎</span>
        <span class="count" id="igCount${i}">좋아요 ${p.likes.toLocaleString()}개</span>
      </div>
      <div class="post-cap"><b>${p.user}</b> ${p.cap}</div>
    </div>`).join('');
}
function likeIG(i) {
  const p = FEEDS_IG[i];
  p.liked = !p.liked;
  p.likes += p.liked ? 1 : -1;
  $('igHeart' + i).textContent = p.liked ? '❤️' : '♡';
  $('igCount' + i).textContent = '좋아요 ' + p.likes.toLocaleString() + '개';
}
/* ---------- 페이스북 ---------- */
let fbRendered = false;
function renderFB() {
  if (fbRendered) return;
  fbRendered = true;
  $('fbFeed').innerHTML = FEEDS_FB.map((p, i) => `
    <div class="fb-post">
      <div class="ph"><div class="avatar" style="background:${p.color}">${p.av}</div><div><div class="n">${p.user}</div><div class="t">${p.time} · 🌐</div></div></div>
      <div class="txt">${p.text}</div>
      <div class="fb-media" style="background:${p.bg}">${p.emoji}</div>
      <div class="fb-stats" style="margin:0 12px;"><span id="fbCnt${i}">👍 ${p.likes}</span><span>댓글 ${p.comments}개</span></div>
      <div class="fb-btns">
        <div id="fbLike${i}" onclick="likeFB(${i})">👍 좋아요</div>
        <div onclick="toast('댓글 기능은 체험용으로 준비 중입니다')">💬 댓글</div>
        <div onclick="toast('공유 완료!')">↪ 공유</div>
      </div>
    </div>`).join('');
}
function likeFB(i) {
  const p = FEEDS_FB[i];
  p.liked = !p.liked;
  p.likes += p.liked ? 1 : -1;
  $('fbLike' + i).classList.toggle('liked', p.liked);
  $('fbCnt' + i).textContent = '👍 ' + p.likes;
}
/* ---------- 초기화 & 시계 ---------- */
function tick() {
  const d = new Date();
  const hm = `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
  $('clock').textContent = hm;
 $('lockTime').textContent = hm;
$('lockDate').textContent = d.toLocaleDateString('ko-KR', {
  month: 'long',
  day: 'numeric',
  weekday: 'long'
});
}
tick(); setInterval(tick, 10000);
buildKeys();
MSG_THREADS.forEach(t => t.lastTime = '');
renderMsgList();
renderKakaoList();
</script>
